# Configuración de pruebas: base de datos H2 en memoria (Fase 3 - H2 queda
# exclusivamente como base de datos de pruebas; la real es MySQL, ver
# src/main/resources/application.properties). Maven usa este archivo
# automáticamente al ejecutar los tests, sin necesidad de activar ningún
# perfil ni tocar las clases de test existentes.

# Puerto para la aplicación
server.port=57075

# Configuración de la base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:masqueamigos;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Activar la consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway no aplica en pruebas: Hibernate genera el esquema H2 directamente
# con ddl-auto=update, igual que antes de la Fase 3.
spring.flyway.enabled=false

# Documentación OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
