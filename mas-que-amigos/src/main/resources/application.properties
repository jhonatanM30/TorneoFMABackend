# Puerto para la aplicación
server.port=57075

# Conexión a MySQL (Fase 4): deliberadamente NO se define aquí. Se
# externaliza por completo a variables de entorno, que Docker Compose
# inyecta al contenedor (ver ../../../../docker-compose.yml y .env.example
# en la raíz del repo). Spring Boot reconoce automáticamente estos nombres
# de variable sin necesidad de declararlos con placeholders en este archivo:
#
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   SPRING_DATASOURCE_DRIVER_CLASS_NAME
#
# Si arrancas el backend manualmente (sin Docker) tienes que exportar estas
# 4 variables en tu sesión de PowerShell antes de ./mvnw.cmd spring-boot:run
# (ver DEPLOYMENT.md) — sin ellas la app no arranca, a propósito: así queda
# claro de inmediato si falta configuración en vez de conectarse en
# silencio a un valor por defecto que podría no ser el correcto.
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# El esquema lo gestiona Flyway (ver src/main/resources/db/migration): a
# Hibernate solo se le pide que valide que las entidades coincidan con el
# esquema real, nunca que lo modifique automáticamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Documentación OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Carga de imagenes (FRONTEND_VISION.md Fase1: escudo de equipo). Los
# archivos se guardan en disco, dentro del contenedor/carpeta de trabajo
# del backend, bajo app.uploads.dir, y se sirven como estaticos en
# /uploads/** (ver config/StaticResourceConfig). app.base-url se usa para
# construir la URL absoluta que se guarda en Equipo.imagenUrl, porque el
# frontend valida que imagenUrl sea una URL http(s) completa.
app.uploads.dir=uploads
app.base-url=http://localhost:${server.port}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
