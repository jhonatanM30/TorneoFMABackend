# Puerto para la aplicación
server.port=57075

# Configuración de la base de datos MySQL (Fase 3).
# Por ahora se dejan los valores directamente aquí (sin variables de entorno,
# a pedido explícito); si más adelante se necesita un valor distinto por
# entorno, esto es lo primero que habría que externalizar.
spring.datasource.url=jdbc:mysql://localhost:3308/masqueamigos?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=masqueamigos
spring.datasource.password=desarrollo
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# El esquema lo gestiona Flyway (ver src/main/resources/db/migration): a
# Hibernate solo se le pide que valide que las entidades coincidan con el
# esquema real, nunca que lo modifique automáticamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Documentación OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
